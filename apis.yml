aid: tiptop
name: Tiptop
description: >-
  Tiptop (Tiptop Labs) is the payments company founded by Postmates co-founder
  Bastian Lehmann that lets shoppers trade in items they already own for
  instant credit at checkout, alongside pay-over-time options. Merchants
  integrate through a Shopify payments app, a Salesforce Commerce Cloud
  cartridge, a Magento 2 module, or the Direct API — the tiptop.js browser
  library plus server-side order-management endpoints (capture, void, refund)
  authenticated with an api-key header. Backed by a16z ($23M Series A, 2022).
  Note: as of July 2026 tiptop.com redirects to mother.ai (Mother Computer
  Inc.) and its TLS certificate has expired, while docs.tiptop.com,
  api.tiptop.com, cdn.tiptop.com, and the first-party packages remain live.
