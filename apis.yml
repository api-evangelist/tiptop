apis:
- name: Tiptop Direct Order Management API
  description: >-
    Server-side order-management endpoints for the Tiptop Direct integration:
    request capture, void (full or partial), and refund (full or partial) of
    orders created through the tiptop.js checkout, addressed by the
    partner-generated orderID. JSON over HTTPS with an api-key header;
    versioned under /v1/; staging host api-stage.tiptop.com.
  humanURL: https://docs.tiptop.com/direct/how-it-works/
  baseURL: https://api.tiptop.com
