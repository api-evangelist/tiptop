  - https://docs.tiptop.com/direct/get-started/
  - https://docs.tiptop.com/salesforce/sandbox-setup-guide/
modes:
  - name: test
    notes: >-
      Sandbox mode — public + private test key pair; isolated from live data.
      Used to complete the onboarding test order.
  - name: live
    notes: Public + private production key pair, issued after the test order is completed and the application approved.
hosts:
  - {environment: test, api: 'https://api-stage.tiptop.com/', script: 'https://cdn-stage.tiptop.com/js/v1/tiptop.js', source: 'https://github.com/tiptopxyz/magento/blob/master/etc/config.xml'}
  - {environment: live, api: 'https://api.tiptop.com/', script: 'https://cdn.tiptop.com/js/v1/tiptop.js'}
test_values: []
test_values_notes: No published test cards, magic identifiers, or fixture tooling; the sandbox is exercised with real checkout flows under test keys.
