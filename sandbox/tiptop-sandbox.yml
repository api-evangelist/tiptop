source: https://docs.tiptop.com/api-keys/
description: >-
  Tiptop's test/sandbox surface. Tiptop separates test (sandbox) and live modes
  by API key pair — each account gets four keys — and runs dedicated staging
  hosts for the API and the tiptop.js CDN build. Objects created in one mode
  cannot be manipulated by the other. Partner onboarding requires completing a
  test order with the test API key before the production key is issued. No
  magic test values (test cards, fixture tokens, test clocks) are published in
  the docs.
docs:
